<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>VEX 纯矢量图标生成器</title>
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background-color: #f1f5f9; margin: 0; flex-direction: column; font-family: -apple-system, sans-serif;
        }
        /* 这里的圆角只是为了网页上预览好看，生成的PNG原图是绝对的方形，打包App时必须是方形 */
        .icon-preview { 
            width: 300px; height: 300px; 
            border-radius: 68px; overflow: hidden; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin-bottom: 30px;
        }
        svg { width: 100%; height: 100%; }
        .btn-download {
            background-color: #0f172a; color: white; border: none; 
            padding: 14px 28px; border-radius: 12px; font-size: 16px; font-weight: bold; 
            cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-download:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="icon-preview">
        <svg id="vex-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            
            <rect width="1024" height="1024" fill="#0B1120" />

            <defs>
                <linearGradient id="redBlue" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="50%" stop-color="#EF4444" />
                    <stop offset="50%" stop-color="#3B82F6" />
                </linearGradient>
            </defs>

            <path d="M 230 240 L 512 800 L 794 240" 
                  fill="none" 
                  stroke="url(#redBlue)" 
                  stroke-width="160" 
                  stroke-linecap="square" 
                  stroke-miterlimit="10" 
                  stroke-linejoin="miter" />

            <circle cx="512" cy="380" r="45" fill="#F59E0B" />

        </svg>
    </div>

    <button class="btn-download" onclick="downloadIcon()">💾 下载 1024x1024 高清 PNG 图标</button>

    <script>
        function downloadIcon() {
            const svgElement = document.getElementById('vex-icon');
            // 将 SVG 序列化为文本
            const svgData = new XMLSerializer().serializeToString(svgElement);
            // 创建一个隐藏的 Canvas 画布，尺寸定死为 1024x1024
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // 将 SVG 转换为图片对象
            const img = new Image();
            // 处理中文或特殊字符的 Base64 编码
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            
            img.onload = function() {
                // 将图片画入 Canvas
                ctx.drawImage(img, 0, 0, 1024, 1024);
                // 触发下载
                const a = document.createElement('a');
                a.download = 'VEX_App_Icon_1024.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            };
        }
    </script>
</body>
</html>
