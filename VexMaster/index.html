    <title>VEX 赛程管理助手</title>
    
    <script src="https://lib.baomitu.com/pdf.js/2.6.347/pdf.min.js"></script>
    <script src="https://lib.baomitu.com/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
// ============================================================
// VEX API 通信模块 (内联版本)
// ============================================================
(function() {
  'use strict';

  const API_BASE = 'https://events.vex.com/api/v2';
  const LOG_PREFIX = '[VexApiSync]';

  function log(message, ...args) { console.log(`${LOG_PREFIX} ${message}`, ...args); }
  function logError(message, ...args) { console.error(`${LOG_PREFIX} ❌ ${message}`, ...args); }
  function logSuccess(message, ...args) { console.log(`${LOG_PREFIX} ✅ ${message}`, ...args); }

  async function fetchEventId(sku, token) {
    log(`开始获取赛事信息: SKU = ${sku}`);
    if (!sku || typeof sku !== 'string') throw new Error('SKU 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    const url = `${API_BASE}/events?sku=${encodeURIComponent(sku)}`;
    const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
    if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
    const data = await response.json();
    if (!data || !data.data || !Array.isArray(data.data) || data.data.length === 0) throw new Error(`未找到 SKU 为 ${sku} 的赛事`);
    const firstEvent = data.data[0];
    const eventId = firstEvent.id;
    if (!eventId || typeof eventId !== 'number') throw new Error('无法提取有效的赛事 ID');
    const divisions = (firstEvent.divisions && Array.isArray(firstEvent.divisions)) ? firstEvent.divisions : [{ id: 1, name: 'Division 1' }];
    const eventInfo = { id: eventId, name: firstEvent.name || '未知赛事', divisions: divisions };
    logSuccess(`获取赛事信息成功: ${eventInfo.name} (${divisions.length} 个赛区)`);
    return eventInfo;
  }

  async function fetchMatchesData(eventId, divisionId, token) {
    log(`获取比赛数据: eventId=${eventId}, divisionId=${divisionId}`);
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!divisionId || typeof divisionId !== 'number') throw new Error('DivisionId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    let allMatches = []; let currentPage = 1; let lastPage = 1;
    do {
      const url = `${API_BASE}/events/${eventId}/divisions/${divisionId}/matches?page=${currentPage}`;
      const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
      if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
      const data = await response.json();
      if (!data || !data.data || !Array.isArray(data.data)) break;
      allMatches = allMatches.concat(data.data);
      if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
      currentPage++;
    } while (currentPage <= lastPage);
    logSuccess(`赛区 ${divisionId} 比赛数据获取完成: 共 ${allMatches.length} 场`);
    return allMatches;
  }

  async function fetchRankings(eventId, divisionId, token) {
    log(`获取赛区排名: eventId=${eventId}, divisionId=${divisionId}`);
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!divisionId || typeof divisionId !== 'number') throw new Error('DivisionId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    try {
      const url = `${API_BASE}/events/${eventId}/divisions/${divisionId}/rankings`;
      const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
      if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
      const data = await response.json();
      const rankings = (data && data.data && Array.isArray(data.data)) ? data.data : [];
      logSuccess(`赛区 ${divisionId} 排名获取完成: ${rankings.length} 条`);
      return rankings;
    } catch (e) { logError(`赛区 ${divisionId} 排名获取失败:`, e.message); return []; }
  }

  function syncScoresToLocal(apiMatchesData) {
    log('开始同步比分到本地...');
    if (!apiMatchesData || !Array.isArray(apiMatchesData)) { logError('API 比赛数据无效'); return 0; }
    let scoresDb = {}; let doneDb = {};
    try {
      const scoresJson = localStorage.getItem('vex_scores_ios');
      const doneJson = localStorage.getItem('vex_done_ios');
      if (scoresJson) scoresDb = JSON.parse(scoresJson);
      if (doneJson) doneDb = JSON.parse(doneJson);
    } catch (e) { logError('读取 LocalStorage 失败:', e); }
    let updatedCount = 0;
    for (const apiMatch of apiMatchesData) {
      let matchId = apiMatch.matchnum ? `Q${apiMatch.matchnum}` : (apiMatch.name || '');
      if (!matchId) continue;
      if (!apiMatch.alliances || !Array.isArray(apiMatch.alliances)) continue;
      for (const alliance of apiMatch.alliances) {
        const score = alliance.score || 0;
        if (!alliance.teams || !Array.isArray(alliance.teams)) continue;
        for (const team of alliance.teams) {
          const teamName = team.team ? team.team.name : (team.name || '');
          if (!teamName) continue;
          scoresDb[`${matchId}_${teamName}`] = String(score);
          updatedCount++;
        }
        if (score > 0) doneDb[matchId] = true;
      }
    }
    try {
      localStorage.setItem('vex_scores_ios', JSON.stringify(scoresDb));
      localStorage.setItem('vex_done_ios', JSON.stringify(doneDb));
      logSuccess(`同步完成: 更新了 ${updatedCount} 条比分记录`);
    } catch (e) { logError('写入 LocalStorage 失败:', e); }
    return updatedCount;
  }

  function mergeRankingsToLocalStorage(apiRankingsData) {
    if (!apiRankingsData || !Array.isArray(apiRankingsData)) return;
    let rankingsDb = {};
    try { const existing = localStorage.getItem('vex_rankings_ios'); if (existing) rankingsDb = JSON.parse(existing); } catch (e) {}
    for (const entry of apiRankingsData) {
      const teamName = entry.team ? entry.team.name : (entry.team_name || '');
      const rank = entry.rank || entry.rankingsort1 || 0;
      if (teamName && rank > 0) rankingsDb[teamName] = rank;
    }
    try { localStorage.setItem('vex_rankings_ios', JSON.stringify(rankingsDb)); logSuccess(`排名合并完成: ${Object.keys(rankingsDb).length} 条`); } catch (e) { logError('写入排名失败:', e); }
  }

  function formatDivisionName(eventName, divName) {
    let level = '';
    const ev = eventName || '';
    if (/小学|ES/i.test(ev)) level = '小学组';
    else if (/初中|MS/i.test(ev)) level = '初中组';
    else if (/高中|HS/i.test(ev)) level = '高中组';
    let div = '';
    const dn = divName || '';
    if (/Final/i.test(dn)) div = 'Final';
    else if (/Division\s+/i.test(dn)) div = dn.replace(/Division\s+/i, '').trim() + '区';
    else if (dn) div = dn;
    if (level && div) return level + ' ' + div;
    if (level) return level;
    if (div) return div;
    return (divName || '默认赛区').substring(0, 15);
  }

  async function runFullSync(sku, token) {
    log('开始一键同步...');
    if (!sku || sku.trim() === '') return { success: false, count: 0, message: 'SKU 参数无效' };
    if (!token || token.trim() === '') return { success: false, count: 0, message: 'Token 参数无效' };
    try {
      const eventInfo = await fetchEventId(sku, token);
      let allMatches = [];
      for (const div of eventInfo.divisions) {
        const matches = await fetchMatchesData(eventInfo.id, div.id, token);
        matches.forEach(m => { m._divisionName = formatDivisionName(eventInfo.name, div.name); });
        allMatches = allMatches.concat(matches);
        try { const rankings = await fetchRankings(eventInfo.id, div.id, token); mergeRankingsToLocalStorage(rankings); } catch (e) { logError(`赛区 ${div.name} 排名失败:`, e.message); }
      }
      const count = syncScoresToLocal(allMatches);
      return { success: true, count, message: `同步成功，共 ${eventInfo.divisions.length} 个赛区，更新了 ${count} 条比分记录` };
    } catch (error) {
      return { success: false, count: 0, message: `同步失败: ${error.message}` };
    }
  }

  function generateScheduleFromApi(apiMatchesData) {
    log('开始从 API 生成赛程...');
    if (!apiMatchesData || !Array.isArray(apiMatchesData)) { logError('API 比赛数据无效'); return 0; }
    let newGlobalMatches = [];
    for (const apiMatch of apiMatchesData) {
      let matchId = apiMatch.matchnum ? `Q${apiMatch.matchnum}` : (apiMatch.name || '');
      if (!matchId) continue;
      let field = apiMatch.field || apiMatch.fieldname || '默认场地';
      let time = '待定';
      if (apiMatch.scheduled) {
        try {
          const d = new Date(apiMatch.scheduled);
          const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
          const period = d.getHours() >= 12 ? 'PM' : 'AM';
          const h = d.getHours() > 12 ? d.getHours() - 12 : (d.getHours() === 0 ? 12 : d.getHours());
          time = `周${dayNames[d.getDay()]} ${h}:${d.getMinutes().toString().padStart(2, '0')} ${period}`;
        } catch (e) { time = '待定'; }
      }
      let team1 = 'TBD', team2 = 'TBD';
      if (apiMatch.alliances && Array.isArray(apiMatch.alliances)) {
        let allTeams = [];
        for (const alliance of apiMatch.alliances) {
          if (alliance.teams && Array.isArray(alliance.teams)) {
            for (const team of alliance.teams) {
              const teamName = team.team ? team.team.name : (team.name || '');
              if (teamName) allTeams.push(teamName);
            }
          }
        }
        if (allTeams.length >= 2) { team1 = allTeams[0]; team2 = allTeams[1]; }
        else if (allTeams.length === 1) { team1 = allTeams[0]; team2 = 'TBD'; }
      }
      const division = apiMatch._divisionName || '默认赛区';
      newGlobalMatches.push({ matchId, field, time, timeValue: 0, team1, team2, division });
    }
    log(`生成了 ${newGlobalMatches.length} 场比赛`);
    try { localStorage.setItem('vex_matches_ios', JSON.stringify(newGlobalMatches)); logSuccess('赛程已写入 LocalStorage'); } catch (e) { logError('写入 LocalStorage 失败:', e); }
    syncScoresToLocal(apiMatchesData);
    return newGlobalMatches.length;
  }

  window.VexApiSync = { fetchEventId, fetchMatchesData, fetchRankings, syncScoresToLocal, mergeRankingsToLocalStorage, runFullSync, generateScheduleFromApi, formatDivisionName };
  log('API 通信模块已加载 (多赛区+排名版)');
})();
    </script>

            <p style="margin:0; font-size:14px;">已提取总数据：<strong id="total-matches-count" style="font-size:18px; color:var(--primary);">0</strong> 场比赛</p>

        <!-- 云端同步配置卡片 -->

    <script>
        // 🍎 【核心修复】：兼容版 worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://lib.baomitu.com/pdf.js/2.6.347/pdf.worker.min.js';
        }

        document.body.addEventListener('focusout', () => {
            setTimeout(() => { window.scrollTo(0, document.body.scrollTop); }, 100);
        });

        let globalMatches = JSON.parse(localStorage.getItem('vex_matches_ios')) || []; 
        let myTeams = JSON.parse(localStorage.getItem('vex_teams_ios')) || [];       
        let currentViewTeam = localStorage.getItem('vex_current_team_ios') || ""; 
        let scoresDb = JSON.parse(localStorage.getItem('vex_scores_ios')) || {};      
        let doneDb = JSON.parse(localStorage.getItem('vex_done_ios')) || {};
        let rankingsDb = JSON.parse(localStorage.getItem('vex_rankings_ios')) || {};
        let currentDivFilter = 'All'; 
        let isHideDone = false; 

        document.addEventListener('DOMContentLoaded', function() {
            const countEl = document.getElementById('total-matches-count');
            if (countEl) countEl.innerText = globalMatches ? globalMatches.length : 0;
            rankingsDb = JSON.parse(localStorage.getItem('vex_rankings_ios')) || {};
            if (myTeams && myTeams.length > 0) window.updateTeamUI();
            window.updateDivisionFilterUI();
            // 加载云端同步配置
            window.loadApiConfig();
        });

        window.saveData = function() {
            localStorage.setItem('vex_matches_ios', JSON.stringify(globalMatches));
            localStorage.setItem('vex_teams_ios', JSON.stringify(myTeams));
            localStorage.setItem('vex_current_team_ios', currentViewTeam);
            localStorage.setItem('vex_scores_ios', JSON.stringify(scoresDb));
            localStorage.setItem('vex_done_ios', JSON.stringify(doneDb));
        }

        window.clearAllData = function() {
            if (confirm("⚠️ 确定要清空所有数据吗？这将删除所有排表和比分！")) {
                localStorage.clear();
                globalMatches = []; myTeams = []; currentViewTeam = ""; scoresDb = {}; doneDb = {}; rankingsDb = {};
                currentDivFilter = 'All';
                document.getElementById('total-matches-count').innerText = "0";
                window.updateTeamUI();
                window.updateDivisionFilterUI();
                alert("数据已全部清空，请重新导入最新文件。");
            }
        }

        // ============================================================
        // 云端同步配置函数
        // ============================================================

        /**
         * 动态添加一个新的 SKU 输入框
         */
        window.addSkuInput = function(value) {
            const container = document.getElementById('sku-inputs-container');
            const row = document.createElement('div');
            row.className = 'sku-row';
            row.innerHTML = `<input type="text" class="event-sku-input" placeholder="赛事 SKU (如 RE-VIQRC-26-5508)"
                style="font-size: 14px; text-transform: uppercase;" onblur="window.saveApiConfig()"
                value="${value || ''}">`;
            container.appendChild(row);
            const input = row.querySelector('input');
            if (!value) input.focus();
            return input;
        }

        /**
         * 删除指定的 SKU 输入框行
         */
        window.removeSkuInput = function(btn) {
            const container = document.getElementById('sku-inputs-container');
            if (container.children.length <= 1) {
                alert('至少保留一个赛事 SKU 输入框');
                return;
            }
            btn.parentElement.remove();
            window.saveApiConfig();
        }

        /**
         * 获取所有有效 SKU（过滤空值、去重）
         */
        window.getSkuList = function() {
            const inputs = document.querySelectorAll('.event-sku-input');
            const skus = [];
            inputs.forEach(input => {
                const val = input.value.trim();
                if (val && !skus.includes(val)) skus.push(val);
            });
            return skus;
        }

        /**
         * 保存 API 配置到 LocalStorage（支持多 SKU）
         */
        window.saveApiConfig = function() {
            const token = document.getElementById('api-token-input').value.trim();
            const skus = window.getSkuList();
            localStorage.setItem('vex_api_token_ios', token);
            localStorage.setItem('vex_event_sku_ios', JSON.stringify(skus));
            console.log('[CloudSync] API 配置已保存:', skus.length, '个 SKU');
        }

        /**
         * 从 LocalStorage 加载 API 配置（支持多 SKU 回显）
         */
        window.loadApiConfig = function() {
            const token = localStorage.getItem('vex_api_token_ios') || '';
            const skuRaw = localStorage.getItem('vex_event_sku_ios') || '';
            document.getElementById('api-token-input').value = token;

            const container = document.getElementById('sku-inputs-container');
            let skuList = [];
            try {
                const parsed = JSON.parse(skuRaw);
                if (Array.isArray(parsed)) skuList = parsed;
            } catch (e) {
                if (skuRaw) skuList = [skuRaw];
            }
            skuList = skuList.filter(s => s && s.trim());

            container.innerHTML = '';
            if (skuList.length === 0) {
                const row = document.createElement('div');
                row.className = 'sku-row';
                row.innerHTML = '<input type="text" class="event-sku-input" placeholder="赛事 SKU (如 RE-VIQRC-26-5508)" style="font-size: 14px; text-transform: uppercase;" onblur="window.saveApiConfig()">';
                container.appendChild(row);
            } else {
                skuList.forEach(sku => window.addSkuInput(sku));
            }
            console.log('[CloudSync] API 配置已加载:', skuList.length, '个 SKU');
        }

        /**
         * 云端同步比分按钮点击事件（支持多 SKU）
         */
        window.syncCloudScores = async function() {
            const btn = document.getElementById('sync-cloud-btn');
            const statusMsg = document.getElementById('sync-status-msg');
            const originalText = btn.innerText;
            const token = document.getElementById('api-token-input').value.trim();
            const skuList = window.getSkuList();

            if (skuList.length === 0) { alert('请先填写赛事 SKU'); return; }
            if (!token) { alert('请先填写 API Token'); return; }

            btn.innerText = '同步中...';
            btn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#f59e0b';

            let totalUpdated = 0;
            let errorMessages = [];

            for (let i = 0; i < skuList.length; i++) {
                const sku = skuList[i];
                statusMsg.innerText = skuList.length > 1
                    ? `同步中 (${i + 1}/${skuList.length}): ${sku}...`
                    : '正在连接云端...';
                try {
                    const result = await VexApiSync.runFullSync(sku, token);
                    if (result.success) {
                        totalUpdated += result.count;
                    } else {
                        errorMessages.push(`${sku}: ${result.message}`);
                    }
                } catch (error) {
                    errorMessages.push(`${sku}: ${error.message}`);
                }
            }

            // 重新读取内存状态并渲染
            const savedScores = localStorage.getItem('vex_scores_ios');
            scoresDb = savedScores ? JSON.parse(savedScores) : {};
            const savedDone = localStorage.getItem('vex_done_ios');
            doneDb = savedDone ? JSON.parse(savedDone) : {};
            const savedRankings = localStorage.getItem('vex_rankings_ios');
            rankingsDb = savedRankings ? JSON.parse(savedRankings) : {};

            window.saveData();
            window.updateTeamUI();
            window.updateDivisionFilterUI();
            if (window.renderMasterTimeline) window.renderMasterTimeline();
            if (window.renderSingleTeam) window.renderSingleTeam();

            let msg = `同步完成，共更新 ${totalUpdated} 条比分记录`;
            if (errorMessages.length > 0) msg += `\n\n失败项:\n${errorMessages.join('\n')}`;
            statusMsg.innerText = `同步完成，共更新 ${totalUpdated} 条比分记录`;
            statusMsg.style.color = errorMessages.length > 0 ? '#f59e0b' : '#10b981';
            alert(msg);

            btn.innerText = originalText;
            btn.disabled = false;
        }

        /**
         * 一键拉取完整赛程按钮点击事件（支持多 SKU + 多赛区聚合拉取）
         */
        window.pullFullSchedule = async function() {
            const btn = document.getElementById('pull-schedule-btn');
            const statusMsg = document.getElementById('sync-status-msg');
            const originalText = btn.innerText;
            const token = document.getElementById('api-token-input').value.trim();
            const skuList = window.getSkuList();

            if (skuList.length === 0) { alert('请先填写赛事 SKU'); return; }
            if (!token) { alert('请先填写 API Token'); return; }

            btn.innerText = '拉取中...';
            btn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#f59e0b';

            let allMatchesData = [];
            let errorMessages = [];

            for (let i = 0; i < skuList.length; i++) {
                const sku = skuList[i];
                try {
                    statusMsg.innerText = `(${i + 1}/${skuList.length}) 获取赛事信息: ${sku}...`;
                    const eventInfo = await VexApiSync.fetchEventId(sku, token);

                    for (const div of eventInfo.divisions) {
                        statusMsg.innerText = `(${i + 1}/${skuList.length}) ${div.name} 赛程数据...`;
                        const matches = await VexApiSync.fetchMatchesData(eventInfo.id, div.id, token);
                        const divLabel = window.VexApiSync.formatDivisionName(eventInfo.name, div.name);
                        matches.forEach(m => { m._divisionName = divLabel; });
                        allMatchesData = allMatchesData.concat(matches);
                        console.log(`[PullSchedule] ${sku}/${div.name}: ${matches.length} 场, 累计 ${allMatchesData.length} 场`);

                        // 同步该赛区的排名
                        try {
                            const rankings = await VexApiSync.fetchRankings(eventInfo.id, div.id, token);
                            VexApiSync.mergeRankingsToLocalStorage(rankings);
                        } catch (e) { console.error(`[PullSchedule] 排名获取失败:`, e.message); }
                    }
                } catch (error) {
                    errorMessages.push(`${sku}: ${error.message}`);
                    console.error(`[PullSchedule] ${sku} 拉取失败:`, error.message);
                }
            }

            if (allMatchesData.length === 0) {
                const msg = errorMessages.length > 0
                    ? `所有赛事拉取失败:\n${errorMessages.join('\n')}`
                    : '未获取到任何比赛数据';
                statusMsg.innerText = msg;
                statusMsg.style.color = '#ef4444';
                alert(msg);
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }

            statusMsg.innerText = `正在生成本地赛程 (${allMatchesData.length} 场)...`;
            const count = VexApiSync.generateScheduleFromApi(allMatchesData);

            // 重新读取全局变量，修复内存状态不同步
            const savedMatches = localStorage.getItem('vex_matches_ios');
            if (savedMatches) globalMatches = JSON.parse(savedMatches);
            const savedScores = localStorage.getItem('vex_scores_ios');
            scoresDb = savedScores ? JSON.parse(savedScores) : {};
            const savedDone = localStorage.getItem('vex_done_ios');
            doneDb = savedDone ? JSON.parse(savedDone) : {};
            const savedRankings = localStorage.getItem('vex_rankings_ios');
            rankingsDb = savedRankings ? JSON.parse(savedRankings) : {};

            const countEl = document.getElementById('total-matches-count');
            if (countEl) countEl.innerText = globalMatches.length;

            myTeams = [];
            currentViewTeam = '';

            window.saveData();
            window.updateTeamUI();
            window.updateDivisionFilterUI();
            if (window.renderMasterTimeline) window.renderMasterTimeline();
            if (window.renderSingleTeam) window.renderSingleTeam();

            let msg = `拉取成功！聚合 ${skuList.length} 个赛事，共生成 ${count} 场比赛`;
            if (errorMessages.length > 0) msg += `\n\n失败项:\n${errorMessages.join('\n')}`;
            statusMsg.innerText = `拉取成功，共生成 ${count} 场比赛`;
            statusMsg.style.color = errorMessages.length > 0 ? '#f59e0b' : '#10b981';
            alert(msg);

            btn.innerText = originalText;
            btn.disabled = false;
        }

        function parseTimeToMinutes(timeStr) {
            const regex = /(?:周)?([一二三四五六日])?\s*(\d{1,2}):(\d{2})\s*([AP]M)?/i;
            const match = timeStr.match(regex);
            if (!match) return 999999; 
            const dayMap = {'一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '日':7};
            let day = match[1] ? dayMap[match[1]] || 0 : 0;
            let hours = parseInt(match[2], 10);
            let mins = parseInt(match[3], 10);
            let ampm = match[4] ? match[4].toUpperCase() : '';
            if (ampm === 'PM' && hours !== 12) hours += 12;
            if (ampm === 'AM' && hours === 12) hours = 0;
            return day * 24 * 60 + hours * 60 + mins;
        }

        function extractDivisionName(filename) {
            let name = filename.replace(/\.pdf$/i, '');
            let match = name.match(/(小学|初中|高中|大学).{0,2}(区|组)/);
            if (match) return match[0];
            let clean = name.replace(/对阵表|比赛|资格赛|VEX|IQ|VIQRC|EDR|VRC|\s+/gi, '').trim();
            return clean ? clean.substring(0, 10) : "默认赛区";
        }

        window.handlePDFUpload = async function(event) {
            if (typeof pdfjsLib === 'undefined') {
                alert("组件加载失败，请检查网络连接后重试！");
                return;
            }
            
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = `正在高速解析，请稍候...`;
            statusMsg.style.color = "#000";

            try {
                let newAddedCount = 0;
                let parsedDivisions = [];

                for (let i = 0; i < files.length; i++) {
                    let file = files[i];
                    let divName = extractDivisionName(file.name);
                    parsedDivisions.push(divName);

                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    
                    let fullText = "";
                    for (let j = 1; j <= pdf.numPages; j++) {
                        const page = await pdf.getPage(j);
                        const textContent = await page.getTextContent();
                        let items = textContent.items;
                        items.sort((a, b) => {
                            if (Math.abs(b.transform[5] - a.transform[5]) > 5) return b.transform[5] - a.transform[5]; 
                            return a.transform[4] - b.transform[4]; 
                        });
                        fullText += items.map(item => item.str).join(' ') + " ";
                    }
                    fullText = fullText.replace(/\s+/g, ' ');
                    newAddedCount += parseV4Engine(fullText, divName); 
                }
                
                window.saveData();
                document.getElementById('total-matches-count').innerText = globalMatches.length;
                let divMsg = parsedDivisions.join(', ');
                statusMsg.innerText = `导入成功！新增 ${newAddedCount} 场。`;
                statusMsg.style.color = "#34c759";
                
                window.updateDivisionFilterUI();
                window.updateTeamUI();
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "解析失败，不支持的PDF格式。";
                statusMsg.style.color = "red";
            }
            event.target.value = ''; 
        }

        function parseV4Engine(fullText, divName) {
            const tokens = fullText.trim().split(/\s+/);
            let matchesData = [];
            let currentChunk = [];
            
            for(let i=0; i<tokens.length; i++) {
                if (/^Q\d+$/i.test(tokens[i])) {
                    if (currentChunk.length > 0) matchesData.push(currentChunk);
                    currentChunk = [tokens[i]];
                } else if (currentChunk.length > 0 && currentChunk.length < 15) {
                    currentChunk.push(tokens[i]);
                }
            }
            if (currentChunk.length > 0) matchesData.push(currentChunk);

            let added = 0;
            matchesData.forEach(chunk => {
                let mId = chunk[0].toUpperCase();
                let timeParts = [];
                let field = "";
                let teams = [];
                
                for(let i = 1; i < chunk.length; i++) {
                    let token = chunk[i];
                    if (token === "Page" || token === "Match" || token === "Qualification") break;
                    
                    if (token.includes(':') || /^[AP]M$/i.test(token) || /^周?[一二三四五六日]$/.test(token)) {
                        timeParts.push(token);
                    } 
                    else if (/^\d+[A-Z]*\*?$/i.test(token)) {
                        teams.push(token.toUpperCase());
                    } 
                    else if (/^[A-Z0-9]+$/i.test(token)) {
                        if (!field) field = token;
                    }
                }
                
                if (teams.length >= 2) {
                    let t2 = teams.pop().replace('*', '');
                    let t1 = teams.pop().replace('*', '');
                    
                    if (!field && teams.length > 0) field = teams.pop();
                    if (!field) field = "未知";
                    
                    let mTime = timeParts.join(' ');
                    
                    const isExist = globalMatches.some(m => m.matchId === mId && m.team1 === t1 && m.team2 === t2);
                    if (!isExist) {
                        globalMatches.push({
                            matchId: mId,
                            field: field,
                            time: mTime,
                            timeValue: parseTimeToMinutes(mTime),
                            team1: t1, 
                            team2: t2,
                            division: divName 
                        });
                        added++;
                    }
                }
            });
            return added;
        }

        window.updateDivisionFilterUI = function() {
            const select = document.getElementById('division-filter');
            if(!select) return;
            const divs = [...new Set(globalMatches.map(m => m.division || '默认赛区'))];
            let html = '<option value="All">全部赛区</option>';
            divs.forEach(d => { html += `<option value="${d}" ${currentDivFilter === d ? 'selected' : ''}>${d}</option>`; });
            select.innerHTML = html;
        }

        window.changeDivisionFilter = function(val) {
            currentDivFilter = val;
            window.renderMasterTimeline();
        }

        window.toggleHideDone = function() {
            isHideDone = !isHideDone;
            const btn = document.getElementById('toggle-done-btn');
            if (isHideDone) {
                btn.innerText = '显示已赛';
                btn.style.background = '#e0f2fe';
                btn.style.color = '#0284c7';
            } else {
                btn.innerText = '隐藏已赛';
                btn.style.background = '#f1f5f9';
                btn.style.color = '#64748b';
            }
            window.renderMasterTimeline();
        }

        window.locateCurrentMatch = function() {
            const currentEl = document.querySelector('.tl-item.next');
            if (currentEl) {
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                alert("当前赛区没有进行中的比赛。");
            }
        }

        window.addTeam = function() {
            const input = document.getElementById('team-search-input');
            const team = input.value.trim().toUpperCase();
            if (!team) return;
            if (globalMatches.length === 0) { alert("请先导入数据！"); return; }
            if (!myTeams.includes(team)) {
                const exists = globalMatches.some(m => m.team1 === team || m.team2 === team);
                if (!exists) { alert(`未找到队伍 ${team}`); return; }
                
                myTeams.push(team);
                currentViewTeam = team;
                window.saveData();
                window.updateTeamUI();
            }
            input.value = '';
        }

        window.removeTeam = function(team) {
            myTeams = myTeams.filter(t => t !== team);
            if (currentViewTeam === team) currentViewTeam = myTeams.length > 0 ? myTeams[0] : "";
            window.saveData();
            window.updateTeamUI();
        }

        window.updateTeamUI = function() {
            const myTeamsCont = document.getElementById('my-teams-container');
            const masterCont = document.getElementById('master-filter-container');
            if(!myTeamsCont || !masterCont) return;
            myTeamsCont.innerHTML = ''; masterCont.innerHTML = '';
            
            myTeams.forEach(team => {
                const tag1 = document.createElement('div');
                tag1.className = `team-tag ${currentViewTeam === team ? 'active' : ''}`;
                tag1.innerHTML = `<span onclick="window.viewSingleTeam('${team}')">${team}</span> <div class="del" onclick="window.removeTeam('${team}')">✕</div>`;
                myTeamsCont.appendChild(tag1);

                const tag2 = document.createElement('div');
                tag2.className = 'team-tag active';
                tag2.innerText = team;
                masterCont.appendChild(tag2);
            });

            window.renderSingleTeam();
            window.renderMasterTimeline();
        }

        window.viewSingleTeam = function(team) {
            currentViewTeam = team;
            window.saveData();
            window.updateTeamUI();
        }

        window.saveScore = function(matchId, team, value) {
            scoresDb[`${matchId}_${team}`] = value;
            window.saveData();
        }

        window.toggleDone = function(event, matchId, team) {
            event.stopPropagation(); 
            const key = `${matchId}_${team}`;
            doneDb[key] = !doneDb[key];
            window.saveData();
            window.renderMasterTimeline();
        }

        window.generatePoster = function() {
            if (typeof html2canvas === 'undefined') {
                alert("生成模块加载中，请检查网络...");
                return;
            }
            const captureArea = document.getElementById('poster-capture-area');
            const btn = document.getElementById('gen-poster-btn');
            
            btn.innerText = "生成中...";
            btn.style.opacity = "0.7";

            const inputs = captureArea.querySelectorAll('.score-input');
            inputs.forEach(input => {
                const scoreText = document.createElement('span');
                scoreText.className = 'temp-score-text';
                scoreText.innerText = input.value ? `得 ${input.value} 分` : '-';
                scoreText.style.fontWeight = 'bold';
                scoreText.style.fontSize = '16px';
                scoreText.style.color = '#3b82f6';
                input.parentNode.insertBefore(scoreText, input);
                input.style.display = 'none';
            });

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 2, 
                    backgroundColor: "#f4f5f7",
                    useCORS: true
                }).then(canvas => {
                    const imgUrl = canvas.toDataURL("image/png");
                    document.getElementById('poster-preview').src = imgUrl;
                    document.getElementById('poster-modal').style.display = 'flex';
                    
                    inputs.forEach(input => { input.style.display = 'inline-block'; });
                    captureArea.querySelectorAll('.temp-score-text').forEach(el => el.remove());

                    btn.innerText = "生成分享海报";
                    btn.style.opacity = "1";
                }).catch(err => {
                    alert("海报生成失败，请重试！");
                    btn.innerText = "生成分享海报";
                    btn.style.opacity = "1";
                });
            }, 300);
        }

        window.renderSingleTeam = function() {
            const container = document.getElementById('single-team-details');
            if (!currentViewTeam) { container.innerHTML = '<div style="text-align:center;color:#aaa;padding:30px;">暂无数据</div>'; return; }

            const teamMatches = globalMatches.filter(m => m.team1 === currentViewTeam || m.team2 === currentViewTeam);
            teamMatches.sort((a, b) => a.timeValue - b.timeValue);

            // 排名显示
            const rank = rankingsDb[currentViewTeam];
            const rankBadge = rank ? `<span class="team-rank">🏅 排名: ${rank}</span>` : '';

            let html = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; padding: 0 5px;">
                    <div style="display:flex; align-items:center;">
                        <h2 style="margin:0; font-size:24px; color:#111;">${currentViewTeam}</h2>
                        ${rankBadge}
                    </div>
                    <button id="gen-poster-btn" class="btn-poster" onclick="window.generatePoster()">生成分享海报</button>
                </div>
                <div style="font-size:12px; color:#888; margin-bottom: 10px; padding: 0 5px;">本次赛事共 ${teamMatches.length} 场</div>
            `;

            teamMatches.forEach(m => {
                const isRed = (m.team1 === currentViewTeam); 
                const myRoleChar = isRed ? "红方" : "蓝方";
                const roleClass = isRed ? "bg-red" : "bg-blue";
                const alliance = isRed ? m.team2 : m.team1;
                const mDiv = m.division || '默认赛区';
                
                const scoreKey = `${m.matchId}_${currentViewTeam}`;
                const score = scoresDb[scoreKey] || '';
                
                html += `
                    <div class="match-card">
                        <div class="mc-top">
                            <div class="mc-q">${m.matchId} <span class="div-badge">${mDiv}</span></div>
                            <div class="mc-time">${m.time}</div>
                        </div>
                        <div class="mc-mid">
                            <div style="display:flex; align-items:center;">
                                <span class="badge ${roleClass}">${myRoleChar}</span>
                                <span style="margin:0 10px; font-size:18px;">🤝</span>
                                <span style="font-weight:800; color:#444; font-size:16px;">${alliance}</span>
                            </div>
                            <div class="mc-field">${m.field}</div>
                        </div>
                        <div class="mc-score">
                            <span style="font-size:14px; color:#64748b; font-weight:bold;">完赛得分</span>
                            <input type="number" class="score-input" placeholder="分数" value="${score}" onchange="window.saveScore('${m.matchId}', '${currentViewTeam}', this.value)">
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.renderMasterTimeline = function() {
            const container = document.getElementById('master-timeline');
            if (myTeams.length === 0) { container.innerHTML = '<div style="text-align:center;color:#aaa;padding:30px;">请先添加队伍</div>'; return; }

            let masterList = [];
            myTeams.forEach(team => {
                let matches = globalMatches.filter(m => m.team1 === team || m.team2 === team);
                matches.forEach(m => {
                    let mDiv = m.division || '默认赛区';
                    if (currentDivFilter !== 'All' && mDiv !== currentDivFilter) return;

                    const isRed = (m.team1 === team);
                    masterList.push({
                        matchId: m.matchId,
                        field: m.field,
                        time: m.time,
                        timeValue: m.timeValue,
                        team1: m.team1,
                        team2: m.team2,
                        division: m.division,
                        cleanTime: m.time.replace(/周[一二三四五六日]\s*/, ''), 
                        myTeam: team,
                        isRed: isRed,
                        alliance: isRed ? m.team2 : m.team1,
                        dbKey: `${m.matchId}_${team}`,
                        divTag: mDiv
                    });
                });
            });

            masterList.sort((a, b) => a.timeValue - b.timeValue);

            container.innerHTML = '';
            
            if (masterList.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#aaa;padding:30px;">当前赛区暂无赛程</div>';
                return;
            }

            let nextMatchFound = false;

            masterList.forEach((m) => {
                const isDone = doneDb[m.dbKey];
                if (isHideDone && isDone) return;

                const myRoleChar = m.isRed ? "红" : "蓝";
                const roleClass = m.isRed ? "bg-red" : "bg-blue";
                const textClass = m.isRed ? "text-red" : "text-blue";
                
                let isNext = false;
                if (!isDone && !nextMatchFound) {
                    isNext = true;
                    nextMatchFound = true; 
                }

                const row = document.createElement('div');
                row.className = `tl-item ${isDone ? 'done' : ''} ${isNext ? 'next' : ''}`;
                row.onclick = () => {
                    window.viewSingleTeam(m.myTeam);
                    document.querySelectorAll('.tab-item')[1].click(); 
                };
                
                row.innerHTML = `
                    ${isNext ? '<div class="next-badge">NOW</div>' : ''}
                    <div class="tl-time">${m.cleanTime}</div>
                    <div class="tl-content">
                        <div>
                            <span class="tl-q">${m.matchId}</span>
                            <span class="mc-field" style="margin-left:8px;">${m.field}</span>
                            ${currentDivFilter === 'All' ? `<span class="div-badge">${m.divTag}</span>` : ''}
                        </div>
                        <div class="tl-row">
                            <span class="${textClass}" style="font-weight:900;">${m.myTeam}</span>
                            <span class="badge ${roleClass}" style="padding:0 6px; font-size:11px;">${myRoleChar}</span>
                            <span style="color:#ccc;">🤝</span>
                            <span style="color:#444; font-weight:800;">${m.alliance}</span>
                        </div>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="done-check" ${isDone ? 'checked' : ''} onclick="window.toggleDone(event, '${m.matchId}', '${m.myTeam}')">
                    </div>
                `;
                container.appendChild(row);
            });
            
            if (container.innerHTML === '') {
                container.innerHTML = '<div style="text-align:center;color:#34c759;padding:40px;font-weight:bold;font-size:16px;">🎉 太棒了，当前列表比赛已全部完成！</div>';
            }
        }

        window.switchTab = function(pageId, title, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            element.classList.add('active');
            document.getElementById('header-title').innerText = title;

            document.getElementById('fab-locate').style.display = (pageId === 'master') ? 'flex' : 'none';
        }
    </script>
</body>
</html>
