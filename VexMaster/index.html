<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VEX 大师">
    <link rel="apple-touch-icon" href="icon.png"> 

    <title>VEX 赛程管理助手</title>
    
    <script src="https://lib.baomitu.com/pdf.js/2.6.347/pdf.min.js"></script>
    <script src="https://lib.baomitu.com/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
// ============================================================
// VEX API 通信模块 (内联版本)
// ============================================================
(function() {
  'use strict';

  const API_BASE = 'https://events.vex.com/api/v2';
  const LOG_PREFIX = '[VexApiSync]';

  function log(message, ...args) { console.log(`${LOG_PREFIX} ${message}`, ...args); }
  function logError(message, ...args) { console.error(`${LOG_PREFIX} ❌ ${message}`, ...args); }
  function logSuccess(message, ...args) { console.log(`${LOG_PREFIX} ✅ ${message}`, ...args); }

  async function fetchEventId(sku, token) {
    log(`开始获取赛事信息: SKU = ${sku}`);
    if (!sku || typeof sku !== 'string') throw new Error('SKU 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    const url = `${API_BASE}/events?sku=${encodeURIComponent(sku)}`;
    const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
    if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
    const data = await response.json();
    if (!data || !data.data || !Array.isArray(data.data) || data.data.length === 0) throw new Error(`未找到 SKU 为 ${sku} 的赛事`);
    const firstEvent = data.data[0];
    const eventId = firstEvent.id;
    if (!eventId || typeof eventId !== 'number') throw new Error('无法提取有效的赛事 ID');
    const divisions = (firstEvent.divisions && Array.isArray(firstEvent.divisions)) ? firstEvent.divisions : [{ id: 1, name: 'Division 1' }];
    const eventInfo = { id: eventId, name: firstEvent.name || '未知赛事', divisions: divisions };
    logSuccess(`获取赛事信息成功: ${eventInfo.name} (${divisions.length} 个赛区)`);
    return eventInfo;
  }

  async function fetchMatchesData(eventId, divisionId, token) {
    log(`获取比赛数据: eventId=${eventId}, divisionId=${divisionId}`);
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!divisionId || typeof divisionId !== 'number') throw new Error('DivisionId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    let allMatches = []; let currentPage = 1; let lastPage = 1;
    do {
      const url = `${API_BASE}/events/${eventId}/divisions/${divisionId}/matches?page=${currentPage}`;
      const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
      if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
      const data = await response.json();
      if (!data || !data.data || !Array.isArray(data.data)) break;
      allMatches = allMatches.concat(data.data);
      if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
      currentPage++;
    } while (currentPage <= lastPage);
    logSuccess(`赛区 ${divisionId} 比赛数据获取完成: 共 ${allMatches.length} 场`);
    return allMatches;
  }

  async function fetchRankings(eventId, divisionId, token) {
    log(`获取赛区排名: eventId=${eventId}, divisionId=${divisionId}`);
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!divisionId || typeof divisionId !== 'number') throw new Error('DivisionId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    try {
      // 排名接口与比赛接口一样分页返回，必须翻页，否则丢第 2 页之后的队伍
      let allRankings = []; let currentPage = 1; let lastPage = 1;
      do {
        const url = `${API_BASE}/events/${eventId}/divisions/${divisionId}/rankings?page=${currentPage}`;
        const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
        if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
        const data = await response.json();
        if (!data || !data.data || !Array.isArray(data.data)) break;
        allRankings = allRankings.concat(data.data);
        if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
        currentPage++;
      } while (currentPage <= lastPage);
      logSuccess(`赛区 ${divisionId} 排名获取完成: ${allRankings.length} 条`);
      return allRankings;
    } catch (e) { logError(`赛区 ${divisionId} 排名获取失败:`, e.message); return []; }
  }

  // ============ 场次 ID 解析与时间格式化 (v2.3 决赛独立编号) ============
  // 背景: matchnum 每个赛区各自从 1 编号, 决赛 (round=15) 会与资格赛撞号,
  // 旧逻辑把决赛第 1 场编成 Q1, 比分键 Q1_队号 互相覆盖 (v2.3 前根本缺陷)。
  // 规则 (2026-11 真实赛事 VE-IQ-26-66973 / 65732 验证):
  // - 资格赛 (round=2): Q{matchnum} — 与 PDF/历史数据兼容
  // - 决赛 (round=15 或名称/赛区含 Final): 单赛区 F{matchnum};
  //   多赛区 F{赛区序号}-{matchnum} (同队可能同时打本赛区决赛+跨赛区总决赛,
  //   两边 matchnum 都从 1 重编, 必须带赛区维度消歧); 重号兜底追加 (2)(3)
  function resolveMatchIds(apiMatchesData) {
    if (!apiMatchesData || !Array.isArray(apiMatchesData)) return;
    // 扫描出现的赛区 (按首次出现顺序), 判断是否多赛事区
    const divIds = [];
    for (const m of apiMatchesData) {
      const dId = m.division && m.division.id;
      if (dId !== undefined && dId !== null && !divIds.includes(dId)) divIds.push(dId);
    }
    const multiDiv = divIds.length > 1;
    const seen = {};
    for (const m of apiMatchesData) {
      if (m._matchId) continue; // 幂等: generateScheduleFromApi 内部再调 syncScoresToLocal 时不重复解析
      const isFinals = Number(m.round) === 15
        || /final/i.test(m.name || '')
        || /final/i.test(m._divisionName || '')
        || /final/i.test((m.division && m.division.name) || '');
      let matchId = '';
      if (!isFinals) {
        matchId = m.matchnum ? `Q${m.matchnum}` : (m.name || '');
      } else if (m.matchnum) {
        matchId = multiDiv ? `F${divIds.indexOf(m.division && m.division.id) + 1}-${m.matchnum}` : `F${m.matchnum}`;
      } else {
        matchId = m.name || '';
      }
      if (!matchId) continue;
      if (isFinals) {
        if (seen[matchId]) { seen[matchId]++; matchId = `${matchId}(${seen[matchId]})`; }
        else { seen[matchId] = 1; }
      }
      m._matchId = matchId;
    }
  }

  // API 时间格式化: 决赛 scheduled 为 null, 回退 started (实际开赛时间)
  function formatApiTime(iso) {
    if (!iso) return '待定';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '待定';
      const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      const period = d.getHours() >= 12 ? 'PM' : 'AM';
      const h = d.getHours() > 12 ? d.getHours() - 12 : (d.getHours() === 0 ? 12 : d.getHours());
      return `周${dayNames[d.getDay()]} ${h}:${d.getMinutes().toString().padStart(2, '0')} ${period}`;
    } catch (e) { return '待定'; }
  }

  // 与 UI 端 parseTimeToMinutes 同算法, 保证云端场次与 PDF 场次排序一致
  function parseLocalTimeToMinutes(timeStr) {
    const m = (timeStr || '').match(/(?:周)?([一二三四五六日])?\s*(\d{1,2}):(\d{2})\s*([AP]M)?/i);
    if (!m) return 999999;
    const dayMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7 };
    let day = m[1] ? dayMap[m[1]] || 0 : 0;
    let hours = parseInt(m[2], 10);
    const mins = parseInt(m[3], 10);
    const ampm = m[4] ? m[4].toUpperCase() : '';
    if (ampm === 'PM' && hours !== 12) hours += 12;
    if (ampm === 'AM' && hours === 12) hours = 0;
    return day * 24 * 60 + hours * 60 + mins;
  }

  function syncScoresToLocal(apiMatchesData) {
    log('开始同步比分到本地...');
    if (!apiMatchesData || !Array.isArray(apiMatchesData)) { logError('API 比赛数据无效'); return 0; }
    resolveMatchIds(apiMatchesData);
    let scoresDb = {}; let doneDb = {};
    try {
      const scoresJson = localStorage.getItem('vex_scores_ios');
      const doneJson = localStorage.getItem('vex_done_ios');
      if (scoresJson) scoresDb = JSON.parse(scoresJson);
      if (doneJson) doneDb = JSON.parse(doneJson);
    } catch (e) { logError('读取 LocalStorage 失败:', e); }
    let updatedCount = 0;
    for (const apiMatch of apiMatchesData) {
      const matchId = apiMatch._matchId || '';
      if (!matchId) continue;
      if (!apiMatch.alliances || !Array.isArray(apiMatch.alliances)) continue;
      for (const alliance of apiMatch.alliances) {
        const score = alliance.score || 0;
        if (!alliance.teams || !Array.isArray(alliance.teams)) continue;
        for (const team of alliance.teams) {
          const teamName = team.team ? team.team.name : (team.name || '');
          if (!teamName) continue;
          scoresDb[`${matchId}_${teamName}`] = String(score);
          updatedCount++;
        }
        if (score > 0) doneDb[matchId] = true;
      }
    }
    try {
      localStorage.setItem('vex_scores_ios', JSON.stringify(scoresDb));
      localStorage.setItem('vex_done_ios', JSON.stringify(doneDb));
      logSuccess(`同步完成: 更新了 ${updatedCount} 条比分记录`);
    } catch (e) { logError('写入 LocalStorage 失败:', e); }
    return updatedCount;
  }

  // 队伍号 -> 库中当前排名来源赛区的队伍总数（多赛区冲突仲裁用）
  const rankSourceSize = {};

  // 与外部 vex-api-sync.js 保持同步的排名合并（v2.2: 新增分区官方榜单存储）
  function mergeRankingsToLocalStorage(apiRankingsData, divisionName) {
    if (!apiRankingsData || !Array.isArray(apiRankingsData)) return;
    let rankingsDb = {};
    try { const existing = localStorage.getItem('vex_rankings_ios'); if (existing) rankingsDb = JSON.parse(existing); } catch (e) {}
    // 只信任 entry.rank；rankingsort1 是排序积分值不是名次，不能当排名兜底
    const parsed = [];
    for (const entry of apiRankingsData) {
      const teamName = (entry.team && entry.team.name) || entry.team_name || '';
      const rank = parseInt(entry.rank, 10);
      if (teamName && Number.isFinite(rank) && rank > 0) parsed.push({ teamName, rank });
    }
    // 同一队伍在多个赛区有排名时（如 Division A + Final），保留队伍数更多的大赛区排名
    for (const p of parsed) {
      const sourceSize = rankSourceSize[p.teamName];
      if (sourceSize === undefined || parsed.length >= sourceSize) {
        rankingsDb[p.teamName] = p.rank;
        rankSourceSize[p.teamName] = parsed.length;
      }
    }
    try { localStorage.setItem('vex_rankings_ios', JSON.stringify(rankingsDb)); logSuccess(`排名合并完成: 本次 ${parsed.length} 条, 库中 ${Object.keys(rankingsDb).length} 条`); } catch (e) { logError('写入排名失败:', e); }

    // 分区官方榜单: 整分区排名明细存 vex_rankings_detail_ios，每次同步整赛区覆盖（实时刷新）
    // 平均分取值: average_points (官方 Avg. Points) > avg_score > average > rankingsort1
    if (divisionName) {
      let nameMap = {};
      try { nameMap = JSON.parse(localStorage.getItem('vex_team_names_ios')) || {}; } catch (e) { nameMap = {}; }
      const standings = [];
      for (const entry of apiRankingsData) {
        const team = (entry.team && entry.team.name) || entry.team_name || '';
        const rank = parseInt(entry.rank, 10);
        if (!team || !Number.isFinite(rank) || rank <= 0) continue;
        const avgRaw = (entry.average_points !== undefined && entry.average_points !== null) ? entry.average_points
          : (entry.avg_score !== undefined && entry.avg_score !== null) ? entry.avg_score
          : (entry.average !== undefined && entry.average !== null) ? entry.average
          : entry.rankingsort1;
        const avg = parseFloat(avgRaw);
        standings.push({ rank, team, name: nameMap[team] || '', avg: Number.isFinite(avg) ? avg : null });
      }
      standings.sort((a, b) => a.rank - b.rank);
      let detail = {};
      try { detail = JSON.parse(localStorage.getItem('vex_rankings_detail_ios')) || {}; } catch (e) { detail = {}; }
      detail[divisionName] = standings;
      try { localStorage.setItem('vex_rankings_detail_ios', JSON.stringify(detail)); logSuccess(`分区榜单已更新: ${divisionName} (${standings.length} 队)`); } catch (e) { logError('写入分区榜单失败:', e); }
    }
  }

  // 拉取赛事全部队伍（自动分页），返回 { 队号: 队名 }；排名接口不含队名，队名只能从这里拿
  async function fetchTeamNames(eventId, token) {
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    const nameMap = {};
    let currentPage = 1, lastPage = 1;
    try {
      do {
        const response = await fetch(`${API_BASE}/events/${eventId}/teams?page=${currentPage}`, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
        if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
        const data = await response.json();
        if (!data || !data.data || !Array.isArray(data.data)) break;
        for (const t of data.data) { if (t && t.number) nameMap[t.number] = t.team_name || t.organization || ''; }
        if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
        currentPage++;
      } while (currentPage <= lastPage);
      logSuccess(`队伍名称获取完成: ${Object.keys(nameMap).length} 队`);
      return nameMap;
    } catch (error) {
      logError(`队伍名称获取失败: ${error.message}`);
      return {};
    }
  }

  // 队名映射合并入库（多赛事累积 merge）
  function mergeTeamNamesToLocalStorage(apiNameMap) {
    if (!apiNameMap || typeof apiNameMap !== 'object') return;
    let nameMap = {};
    try { nameMap = JSON.parse(localStorage.getItem('vex_team_names_ios')) || {}; } catch (e) { nameMap = {}; }
    Object.assign(nameMap, apiNameMap);
    try { localStorage.setItem('vex_team_names_ios', JSON.stringify(nameMap)); logSuccess(`队名映射已入库: 共 ${Object.keys(nameMap).length} 队`); } catch (e) { logError('写入队名映射失败:', e); }
  }

  // ============ 技能赛 / 决赛排名 / 队伍年级 (v2.4) ============
  // 接口形态 2026-11-14 真实赛事 VE-IQ-26-66973 验证:
  // - /events/{id}/skills 分页: {type:'driver'|'programming', attempts, score, rank, team{id,name,code}}
  //   同队两条 type 共享同一官方合并排名 (按 手动最高+自动最高 总分排定)
  // - /events/{id}/divisions/{order}/finalistRankings 决赛官方榜: {rank, team{name}, high_score}
  //   注意路径参数是赛区 order 不是 id
  // - /events/{id}/teams: grade = 'Elementary School'/'Middle School' 等

  // 拉取赛事全部技能赛数据（自动分页）
  async function fetchSkills(eventId, token) {
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    let allSkills = [], currentPage = 1, lastPage = 1;
    try {
      do {
        const response = await fetch(`${API_BASE}/events/${eventId}/skills?page=${currentPage}`, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
        if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
        const data = await response.json();
        if (!data || !data.data || !Array.isArray(data.data)) break;
        allSkills = allSkills.concat(data.data);
        if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
        currentPage++;
      } while (currentPage <= lastPage);
      logSuccess(`技能赛数据获取完成: 共 ${allSkills.length} 条`);
      return allSkills;
    } catch (error) {
      logError(`技能赛数据获取失败: ${error.message}`);
      return []; // 失败不影响主流程
    }
  }

  // 技能赛合并入库 vex_skills_ios: { 队号: {rank, driver:{attempts,best}, programming:{attempts,best}, total} }
  // driver=手动, programming=自动; total = 手动最高 + 自动最高; 多赛事累积, 同队以最新为准
  function mergeSkillsToLocalStorage(apiSkillsData) {
    if (!apiSkillsData || !Array.isArray(apiSkillsData)) return;
    let skillsDb = {};
    try { const ex = localStorage.getItem('vex_skills_ios'); if (ex) skillsDb = JSON.parse(ex); } catch (e) { skillsDb = {}; }
    for (const s of apiSkillsData) {
      const team = (s.team && s.team.name) || s.team_name || '';
      if (!team) continue;
      const cur = skillsDb[team] || { rank: null, driver: { attempts: 0, best: null }, programming: { attempts: 0, best: null }, total: null };
      const slot = (s.type === 'programming') ? cur.programming : cur.driver;
      const attempts = parseInt(s.attempts, 10);
      slot.attempts = Number.isFinite(attempts) && attempts > 0 ? attempts : 0;
      const score = parseFloat(s.score);
      slot.best = Number.isFinite(score) ? score : null;
      const rank = parseInt(s.rank, 10);
      if (Number.isFinite(rank) && rank > 0) cur.rank = rank;
      const d = cur.driver.best, p = cur.programming.best;
      cur.total = (d !== null && p !== null) ? d + p : (d !== null ? d : (p !== null ? p : null));
      skillsDb[team] = cur;
    }
    try { localStorage.setItem('vex_skills_ios', JSON.stringify(skillsDb)); logSuccess(`技能赛数据合并完成: 本次 ${apiSkillsData.length} 条, 库中 ${Object.keys(skillsDb).length} 队`); } catch (e) { logError('写入技能赛数据失败:', e); }
  }

  // 拉取指定赛区决赛排名（自动分页，路径参数为赛区 order）
  async function fetchFinalistRankings(eventId, divisionOrder, token) {
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!divisionOrder || typeof divisionOrder !== 'number') throw new Error('DivisionOrder 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    let allRankings = [], currentPage = 1, lastPage = 1;
    try {
      do {
        const response = await fetch(`${API_BASE}/events/${eventId}/divisions/${divisionOrder}/finalistRankings?page=${currentPage}`, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
        if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
        const data = await response.json();
        if (!data || !data.data || !Array.isArray(data.data)) break;
        allRankings = allRankings.concat(data.data);
        if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
        currentPage++;
      } while (currentPage <= lastPage);
      logSuccess(`决赛排名获取完成: 共 ${allRankings.length} 条`);
      return allRankings;
    } catch (error) {
      logError(`决赛排名获取失败: ${error.message}`);
      return []; // 失败不影响主流程 (未开决赛时接口可能 404)
    }
  }

  // 决赛排名来源赛区队伍数缓存（多赛区仲裁: 总决赛等更小赛区/更"最终"的名次优先保留）
  const finalistSourceSize = {};

  // 决赛排名合并入库: ① 扁平库 vex_finalist_rankings_ios {队号: 名次} (单队视图 🏆 徽章)
  // ② 传入 divisionName 时存整分区决赛榜 vex_finalist_detail_ios {赛区名: [{rank,team,name,score}]}
  function mergeFinalistRankingsToLocalStorage(apiFinalistData, divisionName) {
    if (!apiFinalistData || !Array.isArray(apiFinalistData)) return;
    let rankDb = {};
    try { const ex = localStorage.getItem('vex_finalist_rankings_ios'); if (ex) rankDb = JSON.parse(ex); } catch (e) { rankDb = {}; }
    const parsed = [];
    for (const entry of apiFinalistData) {
      const team = (entry.team && entry.team.name) || entry.team_name || '';
      const rank = parseInt(entry.rank, 10);
      if (team && Number.isFinite(rank) && rank > 0) parsed.push({ team, rank });
    }
    for (const p of parsed) {
      const src = finalistSourceSize[p.team];
      if (src === undefined || parsed.length <= src) {
        rankDb[p.team] = p.rank;
        finalistSourceSize[p.team] = parsed.length;
      }
    }
    try { localStorage.setItem('vex_finalist_rankings_ios', JSON.stringify(rankDb)); logSuccess(`决赛排名合并完成: 本次 ${parsed.length} 条, 库中 ${Object.keys(rankDb).length} 条`); } catch (e) { logError('写入决赛排名失败:', e); }

    if (divisionName) {
      let nameMap = {};
      try { nameMap = JSON.parse(localStorage.getItem('vex_team_names_ios')) || {}; } catch (e) { nameMap = {}; }
      const standings = [];
      for (const entry of apiFinalistData) {
        const team = (entry.team && entry.team.name) || entry.team_name || '';
        const rank = parseInt(entry.rank, 10);
        if (!team || !Number.isFinite(rank) || rank <= 0) continue;
        const score = parseFloat(entry.high_score);
        standings.push({ rank, team, name: nameMap[team] || '', score: Number.isFinite(score) ? score : null });
      }
      standings.sort((a, b) => a.rank - b.rank);
      let detail = {};
      try { detail = JSON.parse(localStorage.getItem('vex_finalist_detail_ios')) || {}; } catch (e) { detail = {}; }
      detail[divisionName] = standings;
      try { localStorage.setItem('vex_finalist_detail_ios', JSON.stringify(detail)); logSuccess(`决赛榜单已更新: ${divisionName} (${standings.length} 队)`); } catch (e) { logError('写入决赛榜单失败:', e); }
    }
  }

  // 拉取赛事队伍年级映射（自动分页）: { 队号: grade } — 技能赛榜小学/初中过滤用
  async function fetchTeamGrades(eventId, token) {
    if (!eventId || typeof eventId !== 'number') throw new Error('EventId 参数无效');
    if (!token || typeof token !== 'string') throw new Error('Token 参数无效');
    const gradeMap = {};
    let currentPage = 1, lastPage = 1;
    try {
      do {
        const response = await fetch(`${API_BASE}/events/${eventId}/teams?page=${currentPage}`, { method: 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
        if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
        const data = await response.json();
        if (!data || !data.data || !Array.isArray(data.data)) break;
        for (const t of data.data) { if (t && t.number && t.grade) gradeMap[t.number] = t.grade; }
        if (data.meta && data.meta.last_page) lastPage = data.meta.last_page;
        currentPage++;
      } while (currentPage <= lastPage);
      logSuccess(`队伍年级获取完成: ${Object.keys(gradeMap).length} 队`);
      return gradeMap;
    } catch (error) {
      logError(`队伍年级获取失败: ${error.message}`);
      return {}; // 失败不影响主流程, 技能赛榜仅显示"全部"
    }
  }

  // 队伍年级映射合并入库（多赛事累积 merge）
  function mergeTeamGradesToLocalStorage(apiGradeMap) {
    if (!apiGradeMap || typeof apiGradeMap !== 'object') return;
    let gradeMap = {};
    try { gradeMap = JSON.parse(localStorage.getItem('vex_team_grades_ios')) || {}; } catch (e) { gradeMap = {}; }
    Object.assign(gradeMap, apiGradeMap);
    try { localStorage.setItem('vex_team_grades_ios', JSON.stringify(gradeMap)); logSuccess(`队伍年级映射已入库: 共 ${Object.keys(gradeMap).length} 队`); } catch (e) { logError('写入队伍年级映射失败:', e); }
  }

  function formatDivisionName(eventName, divName) {
    let level = '';
    const ev = eventName || '';
    if (/小学|ES/i.test(ev)) level = '小学组';
    else if (/初中|MS/i.test(ev)) level = '初中组';
    else if (/高中|HS/i.test(ev)) level = '高中组';
    let div = '';
    const dn = divName || '';
    if (/Final/i.test(dn)) div = 'Final';
    else if (/Default/i.test(dn)) div = ''; // 单赛区赛事 (Default Division) 不显示分区名, 只保留学段
    else if (/Division\s+/i.test(dn)) div = dn.replace(/Division\s+/i, '').trim() + '区';
    else if (dn) div = dn;
    if (level && div) return level + ' ' + div;
    if (level) return level;
    if (div) return div;
    // 兜底 (无分区信息/Default 单赛区)
    return '默认赛区';
  }

  async function runFullSync(sku, token) {
    log('开始一键同步...');
    if (!sku || sku.trim() === '') return { success: false, count: 0, message: 'SKU 参数无效' };
    if (!token || token.trim() === '') return { success: false, count: 0, message: 'Token 参数无效' };
    try {
      const eventInfo = await fetchEventId(sku, token);
      try { mergeTeamNamesToLocalStorage(await fetchTeamNames(eventInfo.id, token)); } catch (e) { logError('队名抓取失败:', e.message); }
      try { mergeTeamGradesToLocalStorage(await fetchTeamGrades(eventInfo.id, token)); } catch (e) { logError('年级抓取失败:', e.message); }
      try { mergeSkillsToLocalStorage(await fetchSkills(eventInfo.id, token)); } catch (e) { logError('技能赛抓取失败:', e.message); }
      let allMatches = [];
      for (const div of eventInfo.divisions) {
        const matches = await fetchMatchesData(eventInfo.id, div.id, token);
        matches.forEach(m => { m._divisionName = formatDivisionName(eventInfo.name, div.name); });
        allMatches = allMatches.concat(matches);
        try { const rankings = await fetchRankings(eventInfo.id, div.id, token); mergeRankingsToLocalStorage(rankings, formatDivisionName(eventInfo.name, div.name)); } catch (e) { logError(`赛区 ${div.name} 排名失败:`, e.message); }
        // 决赛排名 (路径用赛区 order; 未开决赛时为空/404, 不影响主流程)
        try { const fr = await fetchFinalistRankings(eventInfo.id, div.order || div.id, token); mergeFinalistRankingsToLocalStorage(fr, formatDivisionName(eventInfo.name, div.name)); } catch (e) { logError(`赛区 ${div.name} 决赛排名失败:`, e.message); }
      }
      const count = syncScoresToLocal(allMatches);
      return { success: true, count, message: `同步成功，共 ${eventInfo.divisions.length} 个赛区，更新了 ${count} 条比分记录` };
    } catch (error) {
      return { success: false, count: 0, message: `同步失败: ${error.message}` };
    }
  }

  function generateScheduleFromApi(apiMatchesData) {
    log('开始从 API 生成赛程...');
    if (!apiMatchesData || !Array.isArray(apiMatchesData)) { logError('API 比赛数据无效'); return 0; }
    resolveMatchIds(apiMatchesData);
    let newGlobalMatches = [];
    for (const apiMatch of apiMatchesData) {
      const matchId = apiMatch._matchId || apiMatch.name || '';
      if (!matchId) continue;
      let field = apiMatch.field || apiMatch.fieldname || '默认场地';
      // 决赛场次 scheduled 为 null, 回退用 started (实际开赛时间)
      const time = formatApiTime(apiMatch.scheduled || apiMatch.started);
      let team1 = 'TBD', team2 = 'TBD';
      if (apiMatch.alliances && Array.isArray(apiMatch.alliances)) {
        let allTeams = [];
        for (const alliance of apiMatch.alliances) {
          if (alliance.teams && Array.isArray(alliance.teams)) {
            for (const team of alliance.teams) {
              const teamName = team.team ? team.team.name : (team.name || '');
              if (teamName) allTeams.push(teamName);
            }
          }
        }
        if (allTeams.length >= 2) { team1 = allTeams[0]; team2 = allTeams[1]; }
        else if (allTeams.length === 1) { team1 = allTeams[0]; team2 = 'TBD'; }
      }
      const division = apiMatch._divisionName || '默认赛区';
      newGlobalMatches.push({ matchId, field, time, timeValue: parseLocalTimeToMinutes(time), team1, team2, division });
    }
    log(`生成了 ${newGlobalMatches.length} 场比赛`);
    try { localStorage.setItem('vex_matches_ios', JSON.stringify(newGlobalMatches)); logSuccess('赛程已写入 LocalStorage'); } catch (e) { logError('写入 LocalStorage 失败:', e); }
    syncScoresToLocal(apiMatchesData);
    return newGlobalMatches.length;
  }

  window.VexApiSync = { fetchEventId, fetchMatchesData, fetchRankings, fetchTeamNames, mergeTeamNamesToLocalStorage, fetchTeamGrades, mergeTeamGradesToLocalStorage, fetchSkills, mergeSkillsToLocalStorage, fetchFinalistRankings, mergeFinalistRankingsToLocalStorage, syncScoresToLocal, mergeRankingsToLocalStorage, runFullSync, generateScheduleFromApi, formatDivisionName };
  log('API 通信模块已加载 (多赛区+排名版)');
})();

        /**
         * 一键拉取完整赛程按钮点击事件（支持多 SKU + 多赛区聚合拉取）

        window.pullFullSchedule = async function() {
            const btn = document.getElementById('pull-schedule-btn');
            const statusMsg = document.getElementById('sync-status-msg');
            const originalText = btn.innerText;
            const token = document.getElementById('api-token-input').value.trim();
            const skuList = window.getSkuList();

            if (skuList.length === 0) { alert('请先填写赛事 SKU'); return; }
            if (!token) { alert('请先填写 API Token'); return; }

            btn.innerText = '拉取中...';
            btn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#f59e0b';

            let allMatchesData = [];
            let errorMessages = [];

            for (let i = 0; i < skuList.length; i++) {
                const sku = skuList[i];
                try {
                    statusMsg.innerText = `(${i + 1}/${skuList.length}) 获取赛事信息: ${sku}...`;
                    const eventInfo = await VexApiSync.fetchEventId(sku, token);

                    try { VexApiSync.mergeTeamGradesToLocalStorage(await VexApiSync.fetchTeamGrades(eventInfo.id, token)); } catch (e) { console.error('[PullSchedule] 年级抓取失败:', e.message); }

                        const matches = await VexApiSync.fetchMatchesData(eventInfo.id, div.id, token);

                        console.log(`[PullSchedule] ${sku}/${div.name}: ${matches.length} 场, 累计 ${allMatchesData.length} 场`);

                        // 同步该赛区的排名（含整分区官方榜单）

        function parseTimeToMinutes(timeStr) {
            const regex = /(?:周)?([一二三四五六日])?\s*(\d{1,2}):(\d{2})\s*([AP]M)?/i;
            const match = timeStr.match(regex);
            if (!match) return 999999; 
            const dayMap = {'一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '日':7};
            let day = match[1] ? dayMap[match[1]] || 0 : 0;
            let hours = parseInt(match[2], 10);
            let mins = parseInt(match[3], 10);
            let ampm = match[4] ? match[4].toUpperCase() : '';
            if (ampm === 'PM' && hours !== 12) hours += 12;
            if (ampm === 'AM' && hours === 12) hours = 0;
            return day * 24 * 60 + hours * 60 + mins;
        }

        function extractDivisionName(filename) {
            let name = filename.replace(/\.pdf$/i, '');
            let match = name.match(/(小学|初中|高中|大学).{0,2}(区|组)/);
            if (match) return match[0];
            let clean = name.replace(/对阵表|比赛|资格赛|VEX|IQ|VIQRC|EDR|VRC|\s+/gi, '').trim();
            return clean ? clean.substring(0, 10) : "默认赛区";
        }

        window.handlePDFUpload = async function(event) {
            if (typeof pdfjsLib === 'undefined') {
                alert("组件加载失败，请检查网络连接后重试！");
                return;
            }
            
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = `正在高速解析，请稍候...`;
            statusMsg.style.color = "#000";

            try {
                let newAddedCount = 0;
                let parsedDivisions = [];

                for (let i = 0; i < files.length; i++) {
                    let file = files[i];
                    let divName = extractDivisionName(file.name);
                    parsedDivisions.push(divName);

                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    
                    let fullText = "";
                    for (let j = 1; j <= pdf.numPages; j++) {
                        const page = await pdf.getPage(j);
                        const textContent = await page.getTextContent();
                        let items = textContent.items;
                        items.sort((a, b) => {
                            if (Math.abs(b.transform[5] - a.transform[5]) > 5) return b.transform[5] - a.transform[5]; 
                            return a.transform[4] - b.transform[4]; 
                        });
                        fullText += items.map(item => item.str).join(' ') + " ";
                    }
                    fullText = fullText.replace(/\s+/g, ' ');
                    newAddedCount += parseV4Engine(fullText, divName); 
                }
                
                window.saveData();
                document.getElementById('total-matches-count').innerText = globalMatches.length;
                let divMsg = parsedDivisions.join(', ');
                statusMsg.innerText = `导入成功！新增 ${newAddedCount} 场。`;
                statusMsg.style.color = "#34c759";
                
                window.updateDivisionFilterUI();
                window.updateTeamUI();
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "解析失败，不支持的PDF格式。";
                statusMsg.style.color = "red";
            }
            event.target.value = ''; 
        }

        function parseV4Engine(fullText, divName) {
            const tokens = fullText.trim().split(/\s+/);
            let matchesData = [];
            let currentChunk = [];
            
            for(let i=0; i<tokens.length; i++) {
                if (/^Q\d+$/i.test(tokens[i])) {
                    if (currentChunk.length > 0) matchesData.push(currentChunk);
                    currentChunk = [tokens[i]];
                } else if (currentChunk.length > 0 && currentChunk.length < 15) {
                    currentChunk.push(tokens[i]);
                }
            }
            if (currentChunk.length > 0) matchesData.push(currentChunk);

            let added = 0;
            matchesData.forEach(chunk => {
                let mId = chunk[0].toUpperCase();
                let timeParts = [];
                let field = "";
                let teams = [];
                
                for(let i = 1; i < chunk.length; i++) {
                    let token = chunk[i];
                    if (token === "Page" || token === "Match" || token === "Qualification") break;
                    
                    if (token.includes(':') || /^[AP]M$/i.test(token) || /^周?[一二三四五六日]$/.test(token)) {
                        timeParts.push(token);
                    } 
                    else if (/^\d+[A-Z]*\*?$/i.test(token)) {
                        teams.push(token.toUpperCase());
                    } 
                    else if (/^[A-Z0-9]+$/i.test(token)) {
                        if (!field) field = token;
                    }
                }
                
                if (teams.length >= 2) {
                    let t2 = teams.pop().replace('*', '');
                    let t1 = teams.pop().replace('*', '');
                    
                    if (!field && teams.length > 0) field = teams.pop();
                    if (!field) field = "未知";
                    
                    let mTime = timeParts.join(' ');
                    
                    const isExist = globalMatches.some(m => m.matchId === mId && m.team1 === t1 && m.team2 === t2);
                    if (!isExist) {
                        globalMatches.push({
                            matchId: mId,
                            field: field,
                            time: mTime,
                            timeValue: parseTimeToMinutes(mTime),
                            team1: t1, 
                            team2: t2,
                            division: divName 
                        });
                        added++;
                    }
                }
            });
            return added;
        }

            const input = document.getElementById('team-search-input');
            const team = input.value.trim().toUpperCase();
            if (!team) return;
            if (globalMatches.length === 0) { alert("请先导入数据！"); return; }
            if (!myTeams.includes(team)) {
                const exists = globalMatches.some(m => m.team1 === team || m.team2 === team);
                if (!exists) { alert(`未找到队伍 ${team}`); return; }
                
                myTeams.push(team);

            window.updateTeamUI();

        /**
         * 分区排行榜 (v2.2.1 重写):

         *   每行: 名次 / 队伍号 / 队伍名称 / 官方平均分 —— 与官网 Standings 列一致
         * - 无官方榜单数据时回退为本地计算版 (从对阵 + 比分推算)

         * - 点队伍 → 单队视图查看详细对阵与比分
         */
        /**
         * 排行榜数据源切换 (v2.4): 'quals'=资格赛官方榜 | 'finals'=决赛官方榜 (finalistRankings 接口)
         */
        window.setRankMode = function(mode) {

            const qb = document.getElementById('rank-mode-quals'), fb = document.getElementById('rank-mode-finals');

        window.renderLeaderboard = function() {
            const container = document.getElementById('leaderboard-list');
            if (!container) return;

            // 决赛模式: 渲染官方决赛榜 (不依赖本地赛程)
            if (currentRankMode === 'finals') {
                window.renderFinalsLeaderboard();
                return;
            }

            if (!globalMatches || globalMatches.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;">暂无数据，请先导入赛程或拉取云端赛程</div>';
                return;
            }

            const medals = ['🥇', '🥈', '🥉'];

            // 官方榜单行渲染: s = { rank, team, name, avg }
            const officialRow = (s) => {
                const pos = s.rank <= 3
                    ? `<span style="font-size:20px;">${medals[s.rank - 1]}</span>`
                    : `<span style="font-weight:900;color:#f59e0b;font-size:15px;">#${s.rank}</span>`;
                const avgDisp = (s.avg !== undefined && s.avg !== null) ? Math.round(s.avg) : '—';
                const active = s.team === currentViewTeam;
                return `
                    <div onclick="window.gotoTeamDetail('${s.team}')" style="display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid #f1f5f9; cursor:pointer; ${active ? 'background:#eff6ff;border-radius:8px;' : ''}">
                        <div style="width:34px; text-align:center; flex-shrink:0;">${pos}</div>
                        <div style="flex-shrink:0; font-weight:800; font-size:15px; color:#111;">${s.team}</div>
                        <div style="flex:1; font-size:12px; color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.name || ''}</div>
                        <div style="text-align:right; flex-shrink:0;">
                            <div style="font-size:15px; font-weight:800; color:#3b82f6;">${avgDisp}</div>
                            <div style="font-size:10px; color:#94a3b8;">均分</div>
                        </div>
                        <div style="color:#cbd5e1; flex-shrink:0;">›</div>
                    </div>
                `;
            };

            // 渲染一个分区的官方榜单 (divName, entries)；rankN 不从 1 开始时补记
            const officialSection = (divName, entries, showHeader) => {
                let html = showHeader
                    ? `<div style="padding:10px 4px 4px; font-size:13px; font-weight:bold; color:#64748b;">${divName}</div>`
                    : '';
                entries.forEach(s => { html += officialRow(s); });
                return html;
            };

            let html = '';

            if (currentDivFilter !== 'All') {
                // 单一分区: 有官方榜单直接渲染; 空榜单 (如 Final 未开赛) 给出提示
                const list = rankingsDetailDb && rankingsDetailDb[currentDivFilter];
                if (list && list.length > 0) {
                    html = officialSection(currentDivFilter, list, false);
                } else {
                    html = '<div style="text-align:center;color:#aaa;padding:40px;">该赛区暂无官方排名数据（可能尚未开赛）</div>';
                }
            } else if (rankingsDetailDb && Object.keys(rankingsDetailDb).length > 0) {
                // 全部赛区: 各分区官方榜单依次排列
                Object.keys(rankingsDetailDb).forEach(divName => {
                    html += officialSection(divName, rankingsDetailDb[divName], true);
                });
            } else {
                // 回退: 无官方榜单时用本地对阵 + 比分推算 (旧逻辑)
                const divMatches = globalMatches.filter(m => currentDivFilter === 'All' || (m.division || '默认赛区') === currentDivFilter);
                const teams = [...new Set(divMatches.flatMap(m => [m.team1, m.team2]).filter(t => t && t !== 'TBD'))];
                const stats = teams.map(team => {
                    let sum = 0, played = 0;
                    divMatches.forEach(m => {
                        if (m.team1 !== team && m.team2 !== team) return;
                        const s = parseFloat(scoresDb[`${m.matchId}_${team}`]);
                        if (Number.isFinite(s)) { sum += s; played++; }
                    });
                    return { rank: rankingsDb[team], team, name: '', avg: played > 0 ? sum / played : null, played };
                });
                stats.sort((a, b) => {
                    if (a.rank !== undefined && b.rank !== undefined) return a.rank - b.rank;
                    if (a.rank !== undefined) return -1;
                    if (b.rank !== undefined) return 1;
                    return (b.avg ?? -1) - (a.avg ?? -1);
                });
                html = stats.map(s => {
                    const pos = s.rank !== undefined
                        ? (s.rank <= 3 ? `<span style="font-size:20px;">${medals[s.rank - 1]}</span>` : `<span style="font-weight:900;color:#f59e0b;font-size:15px;">#${s.rank}</span>`)
                        : '<span style="color:#ccc;">—</span>';
                    const avgDisp = s.avg !== null ? s.avg.toFixed(1) : '—';
                    const active = s.team === currentViewTeam;
                    return `
                        <div onclick="window.gotoTeamDetail('${s.team}')" style="display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #f1f5f9; cursor:pointer; ${active ? 'background:#eff6ff;border-radius:8px;' : ''}">
                            <div style="width:36px; text-align:center; flex-shrink:0;">${pos}</div>
                            <div style="flex:1; font-weight:800; font-size:16px; color:#111;">${s.team}</div>
                            <div style="text-align:right; flex-shrink:0;">
                                <div style="font-size:15px; font-weight:800; color:#3b82f6;">均分 ${avgDisp}</div>
                                <div style="font-size:11px; color:#94a3b8;">已赛 ${s.played} 场</div>
                            </div>
                            <div style="color:#cbd5e1; flex-shrink:0;">›</div>
                        </div>
                    `;
                }).join('');
            }

            if (!html) {
                html = '<div style="text-align:center;color:#aaa;padding:40px;">当前赛区暂无队伍</div>';
            }
            container.innerHTML = html;
        }

        /**
         * 决赛榜渲染 (v2.4): 数据源 finalistDetailDb (云端 finalistRankings 接口)
         * 每行: 名次 / 队号 / 队名 / 决赛最高分 —— 与官网 Finalist Rankings 一致

            } else if (finalistDetailDb && Object.keys(finalistDetailDb).length > 0) {

        /**
         * 技能赛排行榜 (v2.4): 数据源 skillsDb (云端 /events/{id}/skills)
         * driver=手动, programming=自动, total=两者最高分之和 (官方合并口径, rank 即官方总排名)
         * 右上角按年级过滤 (teamGradeDb): 全部 / 小学 ES / 初中 MS
         * 纯展示列表, 不提供点击跳转 (信息已在行内展示完整)
         */
        window.setSkillFilter = function(val) {
            currentSkillFilter = val;
            document.querySelectorAll('.skill-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.grade === val));
            window.renderSkillsBoard();

        window.renderSkillsBoard = function() {
            const container = document.getElementById('skills-list');
            if (!container) return;
            if (!skillsDb || Object.keys(skillsDb).length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;">暂无技能赛数据<br><span style="font-size:12px;">请点「云端同步比分」或「一键拉取完整赛程」</span></div>';
                return;
            }

            let nameMap = {};
            try { nameMap = JSON.parse(localStorage.getItem('vex_team_names_ios')) || {}; } catch (e) { nameMap = {}; }
            const gradeOf = (team) => {
                const g = teamGradeDb[team];
                if (/Elementary/i.test(g || '')) return 'ES';
                if (/Middle/i.test(g || '')) return 'MS';
                if (/High/i.test(g || '')) return 'HS';
                return '';
            };

            const medals = ['🥇', '🥈', '🥉'];
            let entries = Object.entries(skillsDb).map(([team, s]) => ({ team, ...s }));
            if (currentSkillFilter !== 'All') {
                entries = entries.filter(e => gradeOf(e.team) === currentSkillFilter);
            }
            // 官方 rank 升序, 无 rank (未比完) 放最后
            entries.sort((a, b) => (a.rank || 9999) - (b.rank || 9999));

            if (entries.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;">该年级暂无技能赛数据</div>';
                return;
            }

            let html = '';
            entries.forEach(e => {
                const pos = e.rank && e.rank <= 3
                    ? `<span style="font-size:20px;">${medals[e.rank - 1]}</span>`
                    : `<span style="font-weight:900;color:#3b82f6;font-size:15px;">${e.rank ? '#' + e.rank : '—'}</span>`;
                const name = nameMap[e.team] || '';
                const prog = (e.programming && e.programming.best !== null && e.programming.best !== undefined) ? e.programming.best : null;
                const drv = (e.driver && e.driver.best !== null && e.driver.best !== undefined) ? e.driver.best : null;
                const progN = e.programming ? (e.programming.attempts || 0) : 0;
                const drvN = e.driver ? (e.driver.attempts || 0) : 0;
                const total = (e.total !== null && e.total !== undefined) ? e.total : null;
                html += `
                    <div style="display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid #f1f5f9;">
                        <div style="width:30px; text-align:center; flex-shrink:0;">${pos}</div>
                        <div style="flex:1; min-width:0;">
                            <div style="font-weight:800; font-size:15px; color:#111;">${e.team}</div>
                            <div style="font-size:11px; color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</div>
                        </div>
                        <div style="text-align:center; flex-shrink:0; width:48px;">
                            <div style="font-size:14px; font-weight:800; color:#3b82f6;">${prog !== null ? prog : '—'}</div>
                            <div style="font-size:10px; color:#94a3b8;">自动 ${progN}场</div>
                        </div>
                        <div style="text-align:center; flex-shrink:0; width:48px;">
                            <div style="font-size:14px; font-weight:800; color:#ef4444;">${drv !== null ? drv : '—'}</div>
                            <div style="font-size:10px; color:#94a3b8;">手动 ${drvN}场</div>
                        </div>
                        <div style="text-align:center; flex-shrink:0; width:36px;">
                            <div style="font-size:15px; font-weight:800; color:#111;">${total !== null ? total : '—'}</div>
                            <div style="font-size:10px; color:#94a3b8;">总分</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 排行榜点队伍 → 跳转单队视图查看详细对阵与比分
        window.gotoTeamDetail = function(team) {
            currentViewTeam = team;
            window.saveData();
            window.updateTeamUI();
            const tabs = document.querySelectorAll('.tab-item');
            window.switchTab('single', '单队视图', tabs[1]);
        }

        window.switchTab = function(pageId, title, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            element.classList.add('active');
            document.getElementById('header-title').innerText = title;
        }
    </script>
</body>
</html>
